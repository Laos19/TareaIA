name: "Android: build, pruebas unitarias y de interfaz"

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: android

env:
  REPORTS: ${{ github.workspace }}/reports

jobs:
  build-y-unitarias:
    name: assembleDebug + pruebas JVM + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK
        id: build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - name: Pruebas unitarias (JVM)
        id: unit
        continue-on-error: true
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Android Lint
        id: lint
        continue-on-error: true
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Reporte
        if: always()
        working-directory: .
        run: |
          mkdir -p "$REPORTS/junit"
          cp android/app/build/test-results/testDebugUnitTest/*.xml "$REPORTS/junit/" 2>/dev/null || true
          files=()
          for f in "$REPORTS"/junit/*.xml; do [ -f "$f" ] && files+=("$(basename "$f" .xml | sed 's/^TEST-com.tareia.app.//')=$f"); done
          if [ ${#files[@]} -gt 0 ]; then
            node .github/scripts/junit-summary.mjs "$REPORTS/reporte-android-unitarias.md" "${files[@]}" >> "$GITHUB_STEP_SUMMARY"
          fi
          cp -r android/app/build/reports "$REPORTS/android-reports" 2>/dev/null || true
          {
            echo ""
            echo "| Paso | Resultado |"
            echo "|---|---|"
            echo "| assembleDebug | ${{ steps.build.outcome }} |"
            echo "| testDebugUnitTest | ${{ steps.unit.outcome }} |"
            echo "| lintDebug | ${{ steps.lint.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apk-y-reportes
          path: |
            android/app/build/outputs/apk/debug/*.apk
            reports/
          retention-days: 14
      - name: Resultado
        if: steps.unit.outcome == 'failure'
        run: exit 1

  interfaz:
    name: Pruebas de interfaz Compose (emulador API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Habilitar KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: connectedDebugAndroidTest
        id: ui
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: android
          script: chmod +x gradlew && ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Reporte de pruebas de interfaz
        if: always()
        working-directory: .
        run: |
          mkdir -p "$REPORTS"
          f=$(ls android/app/build/outputs/androidTest-results/connected/debug/*.xml 2>/dev/null | head -1 || true)
          if [ -n "$f" ]; then
            node .github/scripts/junit-summary.mjs "$REPORTS/reporte-android-interfaz.md" "Compose UI (emulador API 34)=$f" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No se generó reporte de pruebas de interfaz." >> "$GITHUB_STEP_SUMMARY"
          fi
          cp -r android/app/build/reports/androidTests "$REPORTS/android-interfaz" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-android-interfaz
          path: reports/
          retention-days: 14
