plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'

    id 'com.google.gms.google-services'

}

android {
    namespace 'com.tareia.app'
    compileSdk 35

    buildFeatures { compose true }

    defaultConfig {
        applicationId 'com.tareia.app'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes { release { minifyEnabled false } }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }
}


dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-compose:1.9.3'

    // Reconocimiento OCR
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    // Jetpack Compose
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Google Sign-In
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.1'
    // OAuth2 para Google Calendar REST (distinto de Google Sign-In)
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

// Firebase
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-auth'

    // Pruebas: unitarias (JVM) y de interfaz Compose (emulador/dispositivo)
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.10.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    // Espresso 3.7+: compatible con Android 16/17 (las versiones previas fallan con InputManager.getInstance)
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    implementation 'com.google.firebase:firebase-ai'
    debugImplementation 'com.google.firebase:firebase-appcheck-debug'

    // Gemini mediante Firebase AI Logic
    implementation 'com.google.firebase:firebase-ai'

    // App Check para el emulador (solo desarrollo)
    debugImplementation 'com.google.firebase:firebase-appcheck-debug'

    // App Check para versiones de producción
    releaseImplementation 'com.google.firebase:firebase-appcheck-playintegrity'

}
